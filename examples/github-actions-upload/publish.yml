# Copy to .github/workflows/publish.yml in the repository that builds your package.
# Repository variables: AWS_ROLE_ARN, AWS_REGION, PYPI_BUCKET, PYPI_DISTRIBUTION_ID (see terraform outputs).
name: Publish package

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # for AWS OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to the index
        run: |
          for file in dist/*; do
            # PEP 503 normalized project name, e.g. My_Package-1.0.0-py3-none-any.whl -> my-package.
            # Older sdists keep dashes in the name (my-package-1.0.0.tar.gz), so strip only the version there
            base=$(basename "$file")
            case "$base" in
              *.whl) raw=${base%%-*} ;;
              *.tar.gz) raw=${base%.tar.gz} && raw=${raw%-*} ;;
              *) echo "::error::Unknown distribution file $base" && exit 1 ;;
            esac
            name=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')
            # Never overwrite a published file: package files are cached as immutable
            if aws s3api head-object --bucket "${{ vars.PYPI_BUCKET }}" --key "$name/$(basename "$file")" >/dev/null 2>&1; then
              echo "::error::$name/$(basename "$file") already exists. Bump the version."
              exit 1
            fi
            aws s3 cp "$file" "s3://${{ vars.PYPI_BUCKET }}/$name/"
          done

      - name: Refresh the index
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.PYPI_DISTRIBUTION_ID }}" --paths "/simple/*"
